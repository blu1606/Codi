services:
  web:
    image: codi-web:${CODI_RELEASE:?CODI_RELEASE required}
    container_name: codi-web
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - /etc/codi/codi.env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  ai-worker:
    image: codi-web:${CODI_RELEASE:?CODI_RELEASE required}
    container_name: codi-ai-worker
    profiles: [ai-worker]
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - /etc/codi/codi.env
    environment:
      NODE_ENV: production
      AI_BACKGROUND_WORKER_ENABLED: "true"
    command: ["pnpm", "--filter", "web", "worker:ai"]
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 210s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
