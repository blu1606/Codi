# Production stack on the VPS: the app image (port 3001 on localhost, behind Caddy) and its own Postgres.
# Secrets live in the env file next to this compose file on the server (never in git); see docs/deployment.md.
services:
  app:
    image: codi-rebuild:${RELEASE:-latest}
    container_name: codi-rebuild-app
    restart: unless-stopped
    env_file: [./rebuild.env]
    environment:
      DATABASE_URL: postgresql://codi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/codi
      # AI jobs (GitHub analysis, knowledge map, quiz generation, learning paths) run in this container; rebuild.env is a
      # copy of Codi's env, so its own value is overridden here. Set it in .env next to this file to turn the worker off.
      AI_BACKGROUND_WORKER_ENABLED: ${AI_BACKGROUND_WORKER_ENABLED:-true}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    security_opt: [no-new-privileges:true]

  db:
    image: postgres:16-alpine
    container_name: codi-rebuild-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: codi
      POSTGRES_USER: codi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "codi", "-d", "codi"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  pgdata:
