name: codi-1

services:
  postgres:
    image: postgres:18
    container_name: codi-1-postgres
    environment:
      POSTGRES_DB: codi-1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - codi-1_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  codi-1_postgres_data:
