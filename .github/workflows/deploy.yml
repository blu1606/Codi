name: CI/CD Pipeline & Vercel Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  validate:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Design Standards & Token Compliance
        run: pnpm run check:standards

      - name: Type Check
        run: pnpm run check-types

      - name: Unit Tests and Coverage Gate
        run: pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=coverage/junit.xml

      - name: Upload Test and Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Vercel Deploy
    needs: validate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Preview Deployment (Khi tạo PR)
      - name: Pull Vercel Environment Information (Preview)
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Preview)
        if: github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Preview)
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          preview_url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --meta githubCommitSha="$REVIEW_SHA")
          {
            echo '## PR preview'
            echo "Source commit: \`$REVIEW_SHA\`"
            echo "Preview URL: $preview_url"
          } >> "$GITHUB_STEP_SUMMARY"

      # Production Deployment (Khi push vào main/master)
      - name: Pull Vercel Environment Information (Production)
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Production)
        if: github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Production)
        if: github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
