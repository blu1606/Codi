name: Codi VPS CI and deployment

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, ci/codi-main-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check design standards
        run: pnpm run check:standards
      - name: Check types
        run: pnpm run check-types
      - name: Run tests and coverage
        run: pnpm run test:coverage
      - name: Build container without production secrets
        run: docker build --label org.opencontainers.image.source=https://github.com/blu1606/Codi -t codi-ci:check .
      - name: Smoke test container with a fake database
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f codi-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name codi-ci-smoke -p 127.0.0.1:3001:3001 \
            -e DATABASE_URL=postgresql://fake:fake@127.0.0.1:5432/fake \
            -e BETTER_AUTH_SECRET=fake-runtime-secret-at-least-thirty-two-characters \
            -e BETTER_AUTH_URL=https://codi.ddnsfree.com \
            codi-ci:check >/dev/null
          for ((attempt=0; attempt<45; attempt++)); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3001/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs codi-ci-smoke
          exit 1

  deploy:
    name: Deploy verified commit to VPS
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    environment: production
    concurrency:
      group: codi-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and publish the exact commit image
        id: publish
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/blu1606/codi:$GITHUB_SHA"
          docker build --label org.opencontainers.image.source=https://github.com/blu1606/Codi -t "$image" .
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_PACKAGES_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker push "$image"
          image_reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ "$image_reference" =~ ^ghcr[.]io/blu1606/codi@sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${image_reference#*@}" >> "$GITHUB_OUTPUT"
      - name: Connect to VPS and deploy this exact commit
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.CODI_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.CODI_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.CODI_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.CODI_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CODI_SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing CODI_SSH_HOST}"
          : "${DEPLOY_PORT:?Missing CODI_SSH_PORT}"
          : "${DEPLOY_USER:?Missing CODI_SSH_USER}"
          : "${DEPLOY_PRIVATE_KEY:?Missing CODI_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing CODI_SSH_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/codi_deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/codi_deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/codi_deploy_key" "$HOME/.ssh/known_hosts"' EXIT
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GH_PACKAGES_TOKEN" | ssh -i "$HOME/.ssh/codi_deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            /opt/codi/deploy.sh "$GITHUB_SHA" "$IMAGE_DIGEST"
