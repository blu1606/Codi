<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="CPU của server theo tải">
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e1; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e88; --grid:#33322f; --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .axis { fill: var(--muted); font-size: 11px; }
  .label { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
</style>
<rect width="720" height="380" rx="8" fill="var(--surface)"/>
<text class="title" x="64" y="26">CPU của server theo tải</text>
<text x="64" y="45">Server dev 2 vCPU / 4 GB · 70% khách xem, 30% học viên đăng nhập · đo từ Việt Nam, gồm ~75 ms mạng</text>
<line x1="64" x2="82" y1="68" y2="68" stroke="var(--s1)" stroke-width="2"/><text x="88" y="72">app Node.js (1 luồng)</text><line x1="244.4" x2="262.4" y1="68" y2="68" stroke="var(--s2)" stroke-width="2"/><text x="268.4" y="72">PostgreSQL</text>
